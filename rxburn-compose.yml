version: "3"

services:
  pod-mdodson-rxburn-api:
    build: ./api
    container_name: pod-mdodson-rxburn-api
    ports:
      - "81"
    volumes:
      - ./api/app.py:/app/app.py:ro,Z
      - ./data/store/rxburn.zarr:/app/rxburn.zarr:Z
      #- ./data/preprocessed_polygons.json:/app/preprocessed_polygons.json:ro,Z
    environment:
      - USERNS_MODE=keep-id
      - LOG_LEVEL=info
      - UVICORN_ACCESS_LOG=true
      - REDIS_URL=redis://pod-mdodson-rxburn-apicache:6379
    depends_on:
      - pod-mdodson-rxburn-apicache
    networks:
      - pod-mdodson-rxburn-backend
    ## neccesary so that zarr store can live in drought group directory
    group_add:
      - keep-groups

  pod-mdodson-rxburn-basemap:
    image: ghcr.io/maplibre/martin:latest
    container_name: pod-mdodson-rxburn-basemap
    volumes:
      - ./basemap:/data:ro
    command: ["--config", "/data/config.yaml"]
    expose:
      - "3000"
    networks:
      - pod-mdodson-rxburn-backend

  pod-mdodson-rxburn-apicache:
    image: docker.io/redis:8-alpine
    container_name: pod-mdodson-rxburn-apicache
    networks:
      - pod-mdodson-rxburn-backend

  pod-mdodson-rxburn-dashboard:
    image: nginx:1.28.0
    container_name: pod-mdodson-rxburn-dashboard
    ports:
      - "18087:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:Z
      - ./dashboard/default.conf:/etc/nginx/conf.d/default.conf:ro,Z
    tmpfs:
      - /var/cache/nginx/rxburn_data_cache:rw,noexec,nosuid,size=512m
    environment:
      - USERNS_MODE=keep-id
    depends_on:
      - pod-mdodson-rxburn-api
      - pod-mdodson-rxburn-basemap
    networks:
      - pod-mdodson-rxburn-backend

networks:
  pod-mdodson-rxburn-backend:
    driver: bridge
    enable_ipv6: false
